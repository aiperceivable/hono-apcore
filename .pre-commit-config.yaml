repos:

  # apdev-js hooks
  - repo: local
    hooks:
      - id: check-chars
        name: apdev-js check-chars
        entry: npx apdev-js check-chars
        language: system
        types_or: [text, ts, javascript]
        exclude: '^node_modules/'
        # One invocation for every file. pre-commit otherwise splits them into
        # parallel batches, and concurrent `npx` processes race to populate the
        # same cache entry when apdev-js is not already in node_modules.
        require_serial: true

      - id: check-imports
        name: apdev-js check-imports
        entry: npx apdev-js check-imports
        language: system
        pass_filenames: false
        always_run: true

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typecheck
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true
        files: \.(ts|tsx)$
